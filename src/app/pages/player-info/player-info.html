<!-- ヘッダー -->
<header>
    <div class="row">
        <button class="col-2 back-btn d-flex justify-content-start" (click)="goBack()">
            <mat-icon class="me-1 py-auto">arrow_back</mat-icon>
            <span class="align-top">戻る</span>
        </button>
        <div class="col-8 text-center">
            <span class="title">Player Info</span>
        </div>
    </div>
</header>

<!-- メインコンテンツ -->
<main>
    <form #playerForm="ngForm" (ngSubmit)="onSubmit()">
        <ng-container *ngFor="let player of [homePlayer(), visitorPlayer()]; let i = index; trackBy: trackByPlayer">
            <!-- プレイヤー -->
            <div class="mb-5">
                <div class="fs-2 fw-bold">
                    <ng-container *ngIf="player.homeKbn === HomeKbn.HOME">{{homeTeamNm() ?? 'ホームプレイヤー'}}</ng-container>
                    <ng-container *ngIf="player.homeKbn === HomeKbn.VISITOR">{{visitorTeamNm() ?? 'ビジタープレイヤー'}}</ng-container>
                </div>
                <!-- プレイヤー名 -->
                <div class="row mb-2">
                    <label class="col-4 fs-4">Name:</label>
                    <input class="col-7 text-box" id="name{{i}}" name="name{{i}}" type="text" [(ngModel)]="player.name"
                        required maxlength="50" minlength="1" pattern="^[a-zA-Z0-9\s\u3000-\u30FF\u4E00-\u9FFF\u3040-\u309Fー]+$">
                    <mat-icon class="col">search</mat-icon>
                </div>
                <!-- プレイヤー名 入力違反 -->
                <div *ngIf="playerForm.controls['name' + i]?.invalid && !playerForm.controls['name' + i]?.errors?.['pattern']" class="row mb-2">
                    <div class="col-4"></div>
                    <div class="col-8 text-danger">プレイヤー名は必須です。1〜50文字以内で入力してください。</div>
                </div>
                <div *ngIf="playerForm.controls['name' + i]?.errors?.['pattern']" class="row mb-2">
                    <div class="col-4"></div>
                    <div class="col-8 text-danger">入力可能な文字は半角英数字と全角文字です。</div>
                </div>
                <!-- スキルレベル -->
                <div class="row mb-2">
                    <label class="col-4 fs-4">Skill level:</label>
                    <div class="col-8" style="height: 50px;">
                        <input class="custom-slider" id="skillLevel{{i}}" name="skillLevel{{i}}" type="range"
                            [(ngModel)]="player.skillLevel" required min="1" max="9" step="1"
                            [style.--thumb-image]="'url(assets/images/ball/ball_' + player.skillLevel + '.svg)'"
                            (ngModelChange)="onSkillChanged(player)">
                    </div>
                </div>
                <!-- スキルレベル 入力違反 -->
                <div *ngIf="playerForm.controls['skillLevel' + i]?.invalid" class="row mb-2">
                    <div class="col-4"></div>
                    <div class="col-8 text-danger">スキルレベルは必須です。1〜9の間で入力してください。</div>
                </div>
                <!-- 目標点数 -->
                <div class="row mb-2">
                    <label class="col-4 fs-4">Race to:</label>
                    <input class="col-7 text-box" id="goal{{i}}" name="goal{{i}}" type="number"
                        [(ngModel)]="player.goal" required min="1" max="99" disabled>
                    <mat-icon class="col">info</mat-icon>
                </div>
                <!-- 目標点数 入力違反 -->
                <div *ngIf="playerForm.controls['goal' + i]?.invalid" class="row mb-2">
                    <div class="col-4"></div>
                    <div class="col-8 text-danger">目標点数は必須です。1〜99の間で入力してください。</div>
                </div>
            </div>
        </ng-container>

        <!-- スタートボタン -->
        <div class="d-flex justify-content-center">
            <button type="submit" class="start-btn col-10 p-3 d-flex justify-content-around align-items-center"
                [disabled]="playerForm.invalid">
                <div class="image-rack-container">
                    <img src="assets/images/ball/rack.svg" alt="ラック">
                </div>
                <div class="col-6" style="font-size: 1.5em;">Start game!</div>
            </button>
        </div>
    </form>
</main>
